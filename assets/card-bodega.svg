<svg xmlns="http://www.w3.org/2000/svg" width="580" height="270" viewBox="0 0 580 270" role="img" aria-label="Bodega-CV: plataforma de logística portuaria">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a24"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <style>
      .t  { font: 800 24px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #f1f5f9; }
      .s  { font: 500 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #94a3b8; }
      .b  { font: 500 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #cbd5e1; }
      .k  { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #67e8f9; }
      .c  { font: 600 11px 'Cascadia Code', Consolas, Menlo, monospace; fill: #a5f3fc; }
      .p  { font: 700 11px 'Segoe UI', Ubuntu, Arial, sans-serif; fill: #042f2e; }
      .dot { animation: blink 2s ease-in-out infinite; }
      @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="579" height="269" rx="16" fill="url(#bg)" stroke="#164e63"/>
  <rect x="0.5" y="0.5" width="579" height="5" rx="2" fill="url(#bar)"/>

  <!-- icono: contenedor -->
  <g transform="translate(28,30)">
    <rect width="48" height="48" rx="12" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
    <rect x="10" y="16" width="28" height="18" rx="2" fill="none" stroke="#67e8f9" stroke-width="2"/>
    <path d="M17 16v18M24 16v18M31 16v18" stroke="#67e8f9" stroke-width="1.5"/>
  </g>
  <text x="92" y="54" class="t">Bodega-CV</text>
  <text x="92" y="76" class="s">Plataforma de logística portuaria (CFS)</text>

  <!-- estado -->
  <rect x="452" y="34" width="100" height="22" rx="11" fill="#2dd4bf"/>
  <circle cx="466" cy="45" r="4" fill="#042f2e" class="dot"/>
  <text x="476" y="49" class="p">MVP activo</text>

  <text x="28" y="118" class="b"><tspan class="k">5 microservicios</tspan> políglotas · DDD + Hexagonal</text>
  <text x="28" y="144" class="b"><tspan class="k">Kafka + Outbox</tspan> · eventos CloudEvents sin 2PC</text>
  <text x="28" y="170" class="b"><tspan class="k">Zero-Trust</tspan> con Vault · Kong · OpenTelemetry</text>
  <text x="28" y="196" class="b"><tspan class="k">Copiloto AIOps</tspan> con servidores MCP + LLM</text>

  <g transform="translate(28,218)">
    <rect width="62" height="24" rx="6" fill="#0e7490" fill-opacity="0.25" stroke="#155e75"/><text x="10" y="16" class="c">Java 21</text>
    <rect x="70" width="36" height="24" rx="6" fill="#0e7490" fill-opacity="0.25" stroke="#155e75"/><text x="80" y="16" class="c">Go</text>
    <rect x="114" width="56" height="24" rx="6" fill="#0e7490" fill-opacity="0.25" stroke="#155e75"/><text x="124" y="16" class="c">NestJS</text>
    <rect x="178" width="46" height="24" rx="6" fill="#0e7490" fill-opacity="0.25" stroke="#155e75"/><text x="188" y="16" class="c">Ruby</text>
    <rect x="232" width="54" height="24" rx="6" fill="#0e7490" fill-opacity="0.25" stroke="#155e75"/><text x="242" y="16" class="c">Kafka</text>
    <rect x="294" width="86" height="24" rx="6" fill="#0e7490" fill-opacity="0.25" stroke="#155e75"/><text x="304" y="16" class="c">ClickHouse</text>
    <rect x="388" width="78" height="24" rx="6" fill="#0e7490" fill-opacity="0.25" stroke="#155e75"/><text x="398" y="16" class="c">OpenShift</text>
    <rect x="474" width="44" height="24" rx="6" fill="#0e7490" fill-opacity="0.25" stroke="#155e75"/><text x="484" y="16" class="c">MCP</text>
  </g>
</svg>
